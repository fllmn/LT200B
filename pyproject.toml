[project]
name = "lt200b"
version = "0.1.0"
description = "Web-based label maker for the Dymo LetraTag LT200B"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "bleak==1.0.1",
    "flask>=3.0",
    "numpy==2.3.2",
    "pillow==11.3.0",
    "platformdirs==4.3.8",
]

[project.scripts]
lt200b = "lt200b.app:main"

[dependency-groups]
dev = [
    "pyinstaller",
    "pytest",
    "ty",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lt200b"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.src]
include = ["src", "tests"]
